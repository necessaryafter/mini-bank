spring.application.name=account-service

# Exposed + Flyway both bind to Spring's DataSource bean. In dev this DataSource
# comes from spring-boot-docker-compose (compose.yaml maps Postgres to a random
# host port, resolved automatically); in other environments set
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD env vars instead of hardcoding here.

# Outbox publishing target. spring-boot-docker-compose doesn't ship a
# connection-details factory for the floci image, so — unlike Postgres —
# this endpoint is hardcoded to the fixed port compose.yaml maps (4566) instead
# of being auto-resolved. The access/secret keys are floci's accepted
# placeholder values, not real credentials. Override via SPRING_CLOUD_AWS_* env
# vars outside local dev.
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.sqs.endpoint=http://localhost:4566

# RF05 - dead-letter queue for transfer-decision. A message still failing after
# this many deliveries is moved by SQS itself to transfer-decision-dlq instead
# of blocking redelivery of the rest of the queue (see docs/adr/0013).
carbonbank.sqs.transfer-decision.max-receive-count=5

# Statement PDFs live in S3 (floci locally, same fixed 4566 endpoint as SQS).
# path-style-access is required against floci: without it the SDK builds
# virtual-hosted URLs (bucket.localhost) that don't resolve, which also breaks the
# presigned GET URLs the statement export hands back. The bucket is created on
# startup (see S3StatementStore); override the name/endpoint via env vars in prod.
spring.cloud.aws.s3.endpoint=http://localhost:4566
spring.cloud.aws.s3.path-style-access-enabled=true
carbonbank.statements.bucket=statements

# How often the OutboxPoller sweeps for unpublished events.
outbox.poll-interval-ms=1000

# Actuator. Expose the operational endpoints over HTTP; health shows component
# details (db, redis, disk) since this is a demo with no untrusted network in
# front of it — restrict to when-authorized before exposing publicly. /actuator/info
# is populated by the build-info file the Gradle springBoot { buildInfo() } generates.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# API docs. springdoc serves the OpenAPI document at /v3/api-docs and Swagger UI at
# /swagger-ui.html (redirects to /swagger-ui/index.html); operations are sorted by
# HTTP method rather than declaration order for a stable, readable page.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
