spring.application.name=transaction-processor

# Distinct port from account-service (8080): an embedded Tomcat is pulled in
# transitively, so both services would otherwise bind 8080 and clash when run
# together. This only serves the actuator endpoints below; use a fixed port so
# Prometheus has a stable scrape target (set server.port=0 for a random free
# port if you don't need to reach it deterministically).
server.port=8081

# This service consumes SQS messages through the Spring Cloud AWS SQS starter
# (@SqsListener, to be added alongside the first consumer).
#
# spring-boot-docker-compose doesn't ship a connection-details factory for the
# floci image, so unlike Postgres/Mongo/Redis this endpoint is hardcoded
# to the fixed port compose.yaml maps (4566) instead of being auto-resolved.
# The access/secret keys are floci's accepted placeholder values, not
# real credentials. Override all of this via SPRING_CLOUD_AWS_* env vars
# outside local dev.
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.sqs.endpoint=http://localhost:4566

# RF05 - dead-letter queue for validate-transfer. A message still failing after
# this many deliveries is moved by SQS itself to validate-transfer-dlq instead
# of blocking redelivery of the rest of the queue (see docs/adr/0013).
carbonbank.sqs.validate-transfer.max-receive-count=5

# Fraud state stores, owned solely by this service (see docs/adr/0007). Host,
# port and credentials for Redis and Mongo are auto-resolved from compose.yaml
# by spring-boot-docker-compose in dev; override via SPRING_DATA_* env vars
# elsewhere. The processor keeps its own Mongo database and Redis key namespace
# so it never collides with (nor reads) account-service's data.
spring.data.mongodb.database=fraud

# Actuator. This service has no REST API (SQS-driven), so the management server is
# the only HTTP surface. Health shows component details (mongo, redis) since this is
# a demo; /actuator/info comes from the Gradle-generated build-info file.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Fraud rules. Each block tunes one rule's threshold(s) and its score weight;
# the engine sums scores into a band (see FRAUD_DETECTION.md and docs/adr/0007).
fraud.max-amount.threshold=10000.00
fraud.velocity.window-seconds=60
fraud.velocity.max-transfers=5
fraud.amount-profile.min-samples=5
fraud.amount-profile.multiplier=10.0
fraud.unusual-hour.min-samples=10
fraud.impossible-travel.max-speed-kmh=900.0
